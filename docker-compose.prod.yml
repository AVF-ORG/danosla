services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./:/var/www
    restart: unless-stopped
    networks:
      - danosla_network

  web:
    image: nginx:1.25-alpine
    container_name: laravel_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.http.conf:/etc/nginx/conf.d/default.conf:ro
      # ^ swap to default.prod.conf once you have a domain + TLS cert (see docs/DEPLOY_AWS.md step 8)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - reverb
    restart: unless-stopped
    networks:
      - danosla_network

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_reverb
    working_dir: /var/www
    env_file:
      - .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www
    restart: unless-stopped
    networks:
      - danosla_network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_worker
    working_dir: /var/www
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
    restart: unless-stopped
    networks:
      - danosla_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_scheduler
    working_dir: /var/www
    env_file:
      - .env
    entrypoint: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - ./:/var/www
    restart: unless-stopped
    networks:
      - danosla_network

networks:
  danosla_network:
    name: danosla_network
