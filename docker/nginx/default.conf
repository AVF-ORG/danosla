server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # ── Non-locale Laravel routes ──────────────────────────────────────────
    location ~ ^/(api|sanctum|storage|_ignition|dashboard|empty2) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Locale-prefixed Laravel routes ─────────────────────────────────────
    # Next.js only owns: /{locale}  and  /{locale}/contact
    # Everything else under /{locale}/ belongs to Laravel
    location ~ ^/(en|fr|pl)/(dashboard|profile|login|register|logout|forgot-password|reset-password|transport-firm-bid|calendar|locale|error-403|error-404|error-419|error-429|error-500|error-503|livewire) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Livewire AJAX with hash suffix (e.g. /en/livewire-a560857a/update) ─
    # Strip the locale prefix and restart matching so it reaches PHP
    location ~ ^/(en|fr|pl)/(livewire-[a-f0-9]+/.+)$ {
        rewrite ^/(?:en|fr|pl)(/livewire-.+)$ $1 last;
    }

    # ── Bare Livewire AJAX (no locale prefix) → PHP ────────────────────────
    location ~ ^/livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Top-level PHP handler ───────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ── Static assets ──────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ── Standard Laravel fallback ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
