# Temporary config for running over plain HTTP by IP address, before a domain + TLS cert exist.
# Once you have a domain: switch docker-compose.prod.yml's nginx volume mount to
# docker/nginx/default.prod.conf instead, and follow docs/DEPLOY_AWS.md step 8 for HTTPS.

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    client_max_body_size 25m;

    # ── Reverb websocket (browser connects to ws://<ip>/app) ───────────────
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Non-locale Laravel routes ──────────────────────────────────────────
    location ~ ^/(api|sanctum|storage|_ignition|dashboard|empty2) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Locale-prefixed Laravel routes ─────────────────────────────────────
    location ~ ^/(en|fr|pl)/(dashboard|profile|login|register|logout|forgot-password|reset-password|transport-firm-bid|calendar|locale|error-403|error-404|error-419|error-429|error-500|error-503|livewire) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Livewire AJAX with hash suffix ──────────────────────────────────────
    location ~ ^/(en|fr|pl)/(livewire-[a-f0-9]+/.+)$ {
        rewrite ^/(?:en|fr|pl)(/livewire-.+)$ $1 last;
    }

    # ── Bare Livewire AJAX (no locale prefix) → PHP ─────────────────────────
    location ~ ^/livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Top-level PHP handler ───────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ── Standard Laravel fallback ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
