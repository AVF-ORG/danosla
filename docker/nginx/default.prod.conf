# Replace YOUR_DOMAIN with your real domain (e.g. app.danosla.com) before deploying.
# Step 1 (first deploy, no cert yet): comment out the whole "server { listen 443 ... }" block
#         below and the redirect in the :80 block, deploy, run certbot, then uncomment both.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Needed for certbot's webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    root /var/www/public;
    index index.php;

    client_max_body_size 25m;

    # ── Reverb websocket (proxied so the browser can use wss://YOUR_DOMAIN/app) ────
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Non-locale Laravel routes ──────────────────────────────────────────
    location ~ ^/(api|sanctum|storage|_ignition|dashboard|empty2) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Locale-prefixed Laravel routes ─────────────────────────────────────
    location ~ ^/(en|fr|pl)/(dashboard|profile|login|register|logout|forgot-password|reset-password|transport-firm-bid|calendar|locale|error-403|error-404|error-419|error-429|error-500|error-503|livewire) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Livewire AJAX with hash suffix ──────────────────────────────────────
    location ~ ^/(en|fr|pl)/(livewire-[a-f0-9]+/.+)$ {
        rewrite ^/(?:en|fr|pl)(/livewire-.+)$ $1 last;
    }

    # ── Bare Livewire AJAX (no locale prefix) → PHP ─────────────────────────
    location ~ ^/livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Top-level PHP handler ───────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ── Standard Laravel fallback ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
